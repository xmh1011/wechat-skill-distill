[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-skill-distill"
version = "0.1.0"
description = "Distill WeChat exports into chat skills and memory backend imports."
requires-python = ">=3.10"
dependencies = ["requests>=2.32.0"]

[project.optional-dependencies]
mem0 = ["mem0ai"]

[project.scripts]
wechat-skill-distill = "wechat_skill_distill.cli:main"

[tool.setuptools.packages.find]
include = ["wechat_skill_distill*"]
