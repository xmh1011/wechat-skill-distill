<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skill Companion Lab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">S</span>
          <div>
            <h1>Skill Companion Lab</h1>
            <p id="runtimeStatus">正在检查模型服务</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="loadDemo" class="secondary" type="button" title="Load demo">
            <span aria-hidden="true">▶</span>
            Demo
          </button>
          <button id="clearChat" class="secondary" type="button" title="Clear chat">
            <span aria-hidden="true">⌫</span>
            Clear
          </button>
          <button id="exportChat" class="primary" type="button" title="Export transcript">
            <span aria-hidden="true">⇩</span>
            Export
          </button>
        </div>
      </header>

      <aside class="sidebar">
        <section class="panel">
          <h2>资产</h2>
          <label class="file-pick">
            <span>Skill 文件</span>
            <input id="skillFiles" type="file" accept=".skill,.md,.txt" multiple />
          </label>
          <label class="file-pick">
            <span>记忆 JSONL</span>
            <input id="memoryFile" type="file" accept=".jsonl,.json,.txt" />
          </label>
        </section>

        <section class="panel">
          <h2>模型协议</h2>
          <label class="field">
            <span>Provider</span>
            <select id="providerSelect" aria-label="Provider"></select>
          </label>
          <label class="field">
            <span>Model</span>
            <input id="modelInput" type="text" autocomplete="off" placeholder="由服务端环境变量决定" />
          </label>
          <p id="modelHint" class="hint">API key 只在本地服务端读取。</p>
        </section>

        <section class="panel">
          <h2>Persona</h2>
          <select id="personaSelect" aria-label="Persona"></select>
          <dl class="facts">
            <div>
              <dt>Mode</dt>
              <dd id="modeValue">No skill</dd>
            </div>
            <div>
              <dt>User ID</dt>
              <dd id="userIdValue">-</dd>
            </div>
            <div>
              <dt>Samples</dt>
              <dd id="sampleCountValue">0</dd>
            </div>
            <div>
              <dt>Memory</dt>
              <dd id="memoryCountValue">0 rows</dd>
            </div>
          </dl>
        </section>
      </aside>

      <main class="chat-shell">
        <div class="conversation-meta">
          <div>
            <strong id="conversationTitle">加载 skill 后开始对话</strong>
            <span id="conversationSub">模型会按 skill 风格生成回复</span>
          </div>
          <div id="statePills" class="state-pills"></div>
        </div>
        <div id="chatLog" class="chat-log" aria-live="polite"></div>
        <form id="composer" class="composer">
          <textarea id="messageInput" rows="2" placeholder="输入一条消息，Enter 发送，Shift+Enter 换行" aria-label="Message"></textarea>
          <button class="primary icon-only" type="submit" title="Send">
            <span aria-hidden="true">↑</span>
          </button>
        </form>
      </main>

      <aside class="inspector">
        <section class="panel">
          <h2>风格线索</h2>
          <div id="styleTokens" class="tokens"></div>
        </section>
        <section class="panel grow">
          <h2>记忆命中</h2>
          <div id="memoryHits" class="hit-list"></div>
        </section>
      </aside>
    </div>

    <template id="messageTemplate">
      <article class="message">
        <div class="bubble"></div>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
